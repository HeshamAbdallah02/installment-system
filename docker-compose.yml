version: '3.8'

# Optional: Only use if you prefer Docker over direct PostgreSQL installation
# For simple setup, install PostgreSQL directly on Windows instead

services:
  postgres:
    image: postgres:15
    container_name: installment-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: myapp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
